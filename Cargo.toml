[workspace]
members = ["crates/tscn"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/hyprtuna/gdmerge"
homepage = "https://github.com/hyprtuna/gdmerge"
authors = ["hyprtuna <108439421+hyprtuna@users.noreply.github.com>"]
keywords = ["godot", "tscn", "merge", "git", "diff"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
