[workspace]
members = ["crates/tscn", "crates/gdmerge"]
# The fuzz targets need nightly and a sanitizer; they are built on their own.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/hyprtuna/gdmerge"
homepage = "https://github.com/hyprtuna/gdmerge"
authors = ["hyprtuna <108439421+hyprtuna@users.noreply.github.com>"]
keywords = ["godot", "tscn", "merge", "git", "diff"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tscn = { path = "crates/tscn", version = "0.3.4" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
thiserror = "2.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
