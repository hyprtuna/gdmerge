name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked -p gdmerge --target ${{ matrix.target }}

      - name: Set archive name
        id: archive
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="gdmerge-${tag}-${{ matrix.target }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          staging="${{ steps.archive.outputs.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gdmerge" "$staging/"
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          tar czf "${staging}.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          staging="${{ steps.archive.outputs.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gdmerge.exe" "$staging/"
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          7z a "${staging}.zip" "./${staging}/*"

      - name: Checksum
        shell: bash
        run: |
          archive="${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}
            ${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
