name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decided first, before anything is built or uploaded, so a release that
  # must not happen stops here and the log shows what the ones that may
  # happen are going to do. Refuses a version older than one live on
  # crates.io and a release with nothing left to do; a half finished release
  # still completes.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.needed.outputs.version }}
      tscn: ${{ steps.needed.outputs.tscn }}
      gdmerge: ${{ steps.needed.outputs.gdmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Work out what this release has to do
        id: needed
        shell: bash
        run: python3 .github/scripts/publish-plan.py tscn gdmerge

  build:
    name: build (${{ matrix.target }})
    needs: [plan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked -p gdmerge --target ${{ matrix.target }}

      - name: Set archive name
        id: archive
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="gdmerge-${tag}-${{ matrix.target }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          staging="${{ steps.archive.outputs.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gdmerge" "$staging/"
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          # Flat, like the zip: the binary is at the top level of the archive.
          tar czf "${staging}.tar.gz" -C "$staging" gdmerge LICENSE README.md

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          staging="${{ steps.archive.outputs.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gdmerge.exe" "$staging/"
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          7z a "${staging}.zip" "./${staging}/*"

      - name: Checksum
        shell: bash
        run: |
          archive="${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}
            ${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  # The GitHub release is gated on the plan like the crates are. Without
  # that a refused release still got its binaries and notes published, and
  # crates.io and GitHub stopped agreeing on what exists.
  publish:
    name: publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Waits for the approval on the `release` environment. By the time it is
  # asked for, the plan job has printed what approving means: which crates
  # get published at which version.
  publish-crates:
    name: publish to crates.io
    needs: [plan, build]
    runs-on: ubuntu-latest
    # crates.io trusted publishing checks this environment name against the one
    # registered on the crate, so the two have to agree.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # An approval can sit for a while. If crates.io changed underneath it,
      # what was approved is no longer what would happen, so stop.
      - name: Confirm the approved plan still holds
        id: again
        shell: bash
        run: python3 .github/scripts/publish-plan.py tscn gdmerge

      - name: Stop if it changed since the approval
        if: steps.again.outputs.tscn != needs.plan.outputs.tscn || steps.again.outputs.gdmerge != needs.plan.outputs.gdmerge
        shell: bash
        run: |
          echo "the plan changed between the approval and now; nothing was uploaded"
          echo "approved: tscn=${{ needs.plan.outputs.tscn }} gdmerge=${{ needs.plan.outputs.gdmerge }}"
          echo "now:      tscn=${{ steps.again.outputs.tscn }} gdmerge=${{ steps.again.outputs.gdmerge }}"
          exit 1

      - name: Exchange the OIDC token for a crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # tscn first: gdmerge depends on it by version, and cargo waits for the
      # new version to reach the index before returning.
      - name: Publish tscn
        if: needs.plan.outputs.tscn == 'true'
        shell: bash
        run: cargo publish -p tscn --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish gdmerge
        if: needs.plan.outputs.gdmerge == 'true'
        shell: bash
        run: cargo publish -p gdmerge --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
