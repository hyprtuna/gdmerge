name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked -p gdmerge --target ${{ matrix.target }}

      - name: Set archive name
        id: archive
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="gdmerge-${tag}-${{ matrix.target }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          staging="${{ steps.archive.outputs.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gdmerge" "$staging/"
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          # Flat, like the zip: the binary is at the top level of the archive.
          tar czf "${staging}.tar.gz" -C "$staging" gdmerge LICENSE README.md

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          staging="${{ steps.archive.outputs.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gdmerge.exe" "$staging/"
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          7z a "${staging}.zip" "./${staging}/*"

      - name: Checksum
        shell: bash
        run: |
          archive="${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}
            ${{ steps.archive.outputs.name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-crates:
    name: publish to crates.io
    needs: [build]
    runs-on: ubuntu-latest
    # crates.io trusted publishing checks this environment name against the one
    # registered on the crate, so the two have to agree.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Refuses a release that would put something older back on top of what is
      # live, or one that has nothing left to do, rather than uploading it or
      # passing quietly. A half finished release still completes.
      - name: Work out what still needs publishing
        id: needed
        shell: bash
        run: python3 .github/scripts/publish-plan.py tscn gdmerge

      - name: Exchange the OIDC token for a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # tscn first: gdmerge depends on it by version, and cargo waits for the
      # new version to reach the index before returning.
      - name: Publish tscn
        if: steps.needed.outputs.tscn == 'true'
        shell: bash
        run: cargo publish -p tscn --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish gdmerge
        if: steps.needed.outputs.gdmerge == 'true'
        shell: bash
        run: cargo publish -p gdmerge --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
