name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --all-features --workspace

  # The rust-version each crate declares is a promise to consumers, so it is
  # checked rather than assumed. Keep these pinned to the Cargo.toml values.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.74, the tscn rust-version
        uses: dtolnay/rust-toolchain@1.74.0

      - name: Check tscn
        shell: bash
        run: cargo +1.74.0 check -p tscn --all-targets --locked

      - name: Install Rust 1.85, the gdmerge rust-version
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check gdmerge
        shell: bash
        run: cargo +1.85.0 check --workspace --all-targets --locked

  gate:
    name: gate
    needs: [build, msrv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        shell: bash
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more build jobs failed or were cancelled."
            exit 1
          fi
