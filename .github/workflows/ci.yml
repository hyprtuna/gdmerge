name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --all-features --workspace

  # The rust-version each crate declares is a promise to consumers, so it is
  # checked rather than assumed. Keep these pinned to the Cargo.toml values.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.74, the tscn rust-version
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.74.0

      - name: Check tscn
        shell: bash
        run: cargo +1.74.0 check -p tscn --all-targets --locked

      - name: Install Rust 1.85, the gdmerge rust-version
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0

      - name: Check gdmerge
        shell: bash
        run: cargo +1.85.0 check --workspace --all-targets --locked

  # The release workflow's plan script decides what gets published, so it is
  # tested like the code is.
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the release plan
        shell: bash
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # The one required check. Every needed job has to have succeeded: a job
  # that was skipped did not pass, and looking only for failures let one
  # through.
  gate:
    name: gate
    needs: [build, msrv, scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
