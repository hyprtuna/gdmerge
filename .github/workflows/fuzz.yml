name: Fuzz

# The parser reads files that arrive from forks and pull requests, so the thing
# worth guarding against is a malformed one crashing the process rather than
# failing to parse. Weekly is enough: this is a soak, not a gate, and it does
# not block pull requests.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lex, value, document]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libFuzzer needs a sanitizer, which needs nightly.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-fuzz

      # The real scene fixtures are a far better starting corpus than random
      # bytes, and they are already in the repository, so they are passed as an
      # extra read-only corpus rather than copied into the seeds.
      - name: Fuzz for ten minutes
        shell: bash
        run: |
          # cargo-fuzz requires an explicitly named corpus directory to exist.
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          extra=""
          if [ "${{ matrix.target }}" != "value" ]; then
            extra="crates/tscn/tests/fixtures"
          fi
          # cargo-fuzz defaults to the triple it was itself built for. The
          # binary installed here is musl linked, and a sanitizer cannot be used
          # with a statically linked libc, so the host triple is passed
          # explicitly rather than inferred.
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo fuzz run --target "$host" "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" \
            "fuzz/seeds/${{ matrix.target }}" \
            $extra \
            -- -max_total_time=600 -print_final_stats=1

      - name: Keep any crash that was found
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
