<svg xmlns="http://www.w3.org/2000/svg" width="860" height="496" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<style>
.bg{fill:#12141c}.p{fill:#7aa2f7}.o{fill:#c0caf5}.c{fill:#9ece6a}.w{fill:#e0af68}
text{opacity:0;animation:r .01s linear forwards}@keyframes r{to{opacity:1}}
</style>
<rect class="bg" width="860" height="496" rx="8"/>
<circle cx="22" cy="22" r="6" fill="#f7768e"/><circle cx="42" cy="22" r="6" fill="#e0af68"/><circle cx="62" cy="22" r="6" fill="#9ece6a"/>
<text class="p" x="20" y="62" style="animation-delay:0.00s" xml:space="preserve">$ git merge tuning</text>
<text class="w" x="20" y="84" style="animation-delay:0.35s" xml:space="preserve">  gdmerge: conflict in root node "Player" (speed changed differently on both sides)</text>
<text class="o" x="20" y="106" style="animation-delay:0.70s" xml:space="preserve">  gdmerge:   speed: ours 250.0 / theirs 400.0</text>
<text class="o" x="20" y="128" style="animation-delay:1.05s" xml:space="preserve">  gdmerge: run `git mergetool --tool=gdmerge` to see the two sides side by side</text>
<text class="w" x="20" y="150" style="animation-delay:1.40s" xml:space="preserve">  CONFLICT (content): Merge conflict in player.tscn</text>
<text class="w" x="20" y="172" style="animation-delay:1.75s" xml:space="preserve">  Automatic merge failed; fix conflicts and then commit the result.</text>
<text class="p" x="20" y="194" style="animation-delay:2.10s" xml:space="preserve">$ git mergetool --no-prompt --tool=gdmerge</text>
<text class="w" x="20" y="216" style="animation-delay:2.45s" xml:space="preserve">  1 conflict in player.tscn</text>
<text class="o" x="20" y="238" style="animation-delay:2.80s" xml:space="preserve">  </text>
<text class="o" x="20" y="260" style="animation-delay:3.15s" xml:space="preserve">  Conflict 1 of 1: root node "Player"</text>
<text class="o" x="20" y="282" style="animation-delay:3.50s" xml:space="preserve">    speed changed differently on both sides</text>
<text class="o" x="20" y="304" style="animation-delay:3.85s" xml:space="preserve">  </text>
<text class="o" x="20" y="326" style="animation-delay:4.20s" xml:space="preserve">       property  base               ours               theirs</text>
<text class="o" x="20" y="348" style="animation-delay:4.55s" xml:space="preserve">       --------  -----------------  -----------------  -----------------</text>
<text class="o" x="20" y="370" style="animation-delay:4.90s" xml:space="preserve">       name      "Player"           "Player"           "Player"</text>
<text class="o" x="20" y="392" style="animation-delay:5.25s" xml:space="preserve">       type      "CharacterBody2D"  "CharacterBody2D"  "CharacterBody2D"</text>
<text class="w" x="20" y="414" style="animation-delay:5.60s" xml:space="preserve">    &gt;  speed     100.0              250.0              400.0</text>
<text class="o" x="20" y="436" style="animation-delay:5.95s" xml:space="preserve">  </text>
<text class="w" x="20" y="458" style="animation-delay:6.30s" xml:space="preserve">  Rows marked with &gt; are the ones to resolve. Edit the file, remove the conflict</text>
<text class="o" x="20" y="480" style="animation-delay:6.65s" xml:space="preserve">  markers, then stage it.</text>
</svg>
